name: Build IFmont APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore IFmont assets
        shell: bash
        run: |
          base64 -d app/src/main/assets/index.html.gz.b64 | gunzip > app/src/main/assets/index.html
          base64 -d app/src/main/assets/ifmont-logo.jpg.b64 > app/src/main/assets/ifmont-logo.jpg
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: IFmont-Servis-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
